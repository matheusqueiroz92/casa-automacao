name: casa-automacao

services:
  mqtt:
    image: eclipse-mosquitto:2.1.4-alpine
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    networks:
      - internal
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.tcp.routers.casa-mqtt.entrypoints: websecure
      traefik.tcp.routers.casa-mqtt.rule: HostSNI(`casa-mqtt.matheusqueiroz.dev.br`)
      traefik.tcp.routers.casa-mqtt.tls: "true"
      traefik.tcp.routers.casa-mqtt.tls.certresolver: letsencrypt
      traefik.tcp.services.casa-mqtt.loadbalancer.server.port: "1883"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      DB_MAX_CONNECTIONS: 5
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS}
      MQTT_URL: mqtt://mqtt:1883
      MQTT_USERNAME: ${MQTT_API_USERNAME}
      MQTT_PASSWORD: ${MQTT_API_PASSWORD}
    command: ["sh", "-c", "npm run db:migrate:prod --workspace @casa/api && npm run start --workspace @casa/api"]
    depends_on:
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.http.routers.casa-api.entrypoints: websecure
      traefik.http.routers.casa-api.rule: Host(`casa-api.matheusqueiroz.dev.br`)
      traefik.http.routers.casa-api.tls.certresolver: letsencrypt
      traefik.http.services.casa-api.loadbalancer.server.port: "3000"

volumes:
  mosquitto-data:

networks:
  internal:
    internal: true
  traefik-public:
    external: true

