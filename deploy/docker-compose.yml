name: casa-automacao

services:
  postgres:
    image: postgres:17.12-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  mqtt:
    image: eclipse-mosquitto:2.1.4-alpine
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    networks:
      - internal
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.tcp.routers.casa-mqtt.entrypoints: websecure
      traefik.tcp.routers.casa-mqtt.rule: HostSNI(`casa-mqtt.matheusqueiroz.dev.br`)
      traefik.tcp.routers.casa-mqtt.tls: "true"
      traefik.tcp.routers.casa-mqtt.tls.certresolver: letsencrypt
      traefik.tcp.services.casa-mqtt.loadbalancer.server.port: "1883"

  api:
    build:
      context: ../services/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      API_KEY: ${API_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MQTT_URL: mqtt://mqtt:1883
      MQTT_USERNAME: ${MQTT_API_USERNAME}
      MQTT_PASSWORD: ${MQTT_API_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.http.routers.casa-api.entrypoints: websecure
      traefik.http.routers.casa-api.rule: Host(`casa-api.matheusqueiroz.dev.br`)
      traefik.http.routers.casa-api.tls.certresolver: letsencrypt
      traefik.http.services.casa-api.loadbalancer.server.port: "3000"

volumes:
  postgres-data:
  mosquitto-data:

networks:
  internal:
    internal: true
  traefik-public:
    external: true

